<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="base.css">
<style>
  body { padding: 2px; }
  .c { background: var(--bg); border: 1px solid var(--rule); border-left: 2px solid var(--gold); margin-bottom: 6px; padding: 7px 9px; }
  .c.buy { border-left-color: var(--magic); }
  .c.plain { border-left-color: var(--faint); }
  .c.live { border-left-color: var(--sell); }
  .top { display: flex; justify-content: space-between; gap: 8px; }
  .what { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .price { font-family: 'PlexMono', monospace; color: var(--gold); white-space: nowrap; }
  .who { color: var(--muted); font-size: 12px; margin: 1px 0 6px; }
  .who b { color: var(--sell); font-weight: 400; }
  .btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .btns button { padding: 2px 7px; font-size: 12px; }
  .x { margin-left: auto; background: none; border: none; color: var(--faint); }
  .msg { color: var(--muted); font-size: 12px; margin-bottom: 6px; word-break: break-word; }
</style>
</head>
<body>
<div id="list"></div>
<script src="notify.js"></script>
</body>
</html>
