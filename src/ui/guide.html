<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="base.css">
<style>
  #g { background: rgba(21,20,15,0.93); border: 1px solid var(--rule); border-left: 2px solid var(--gold); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
  .bar b { color: var(--text); font-weight: 600; }
  .bar .grow { flex: 1; }
  .bar button { padding: 0 7px; font-size: 13px; line-height: 20px; background: none; }
  .step { padding: 6px 10px; }
  .step.now { font-size: 14px; padding-top: 9px; padding-bottom: 8px; }
  .step.next { color: var(--muted); font-size: 12px; padding-top: 3px; padding-bottom: 3px; }
  .step.next + .step.next { opacity: 0.7; }
  .subs { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .subs div::before { content: '– '; color: var(--faint); }
  .area { color: #d8c79a; } .area.town { color: var(--sell); }
  .kill { color: var(--bad); font-weight: 600; }
  .quest { color: var(--gold); }
  .qtext { color: #b9a6e0; }
  .tag { font-family: 'PlexMono', monospace; font-size: 11px; border: 1px solid var(--rule); padding: 0 3px; border-radius: 2px; color: var(--muted); }
  .lvl { color: var(--faint); font-size: 11px; }
  .rew { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .rew .pick { color: var(--gem); }
  .rew .buy { color: var(--text); }
  .dir { font-family: 'PlexMono', monospace; color: var(--gold); }
  .done { padding: 14px 10px; color: var(--muted); }
</style>
</head>
<body>
<div id="g"></div>
<script src="guide.js"></script>
</body>
</html>
