<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://web.poecdn.com">
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #frame { position: absolute; outline: 1px dashed transparent; }
  #frame.cal { outline-color: var(--gold); background: rgba(201,162,74,0.07); cursor: move; }
  #frame.cal .grip { display: block; }
  .grip { display: none; position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px; background: var(--gold); cursor: nwse-resize; }
  .cell { position: absolute; display: flex; align-items: flex-end; justify-content: flex-end; padding: 1px 3px; font-family: 'PlexMono', monospace; font-size: 11px; line-height: 1; color: var(--text); text-shadow: 0 0 3px #000, 0 0 2px #000; pointer-events: none; }
  .cell img { width: 1.25em; height: 1.25em; margin-left: 1px; filter: drop-shadow(0 0 2px #000); }
  #bar img { width: 16px; height: 16px; vertical-align: -3px; margin-left: 2px; }
  .cell.sell { box-shadow: inset 0 0 0 1px var(--gold); }
  .cell.cheap { box-shadow: inset 0 0 0 2px var(--bad); }
  .cell.low { color: var(--faint); }
  .hl { position: absolute; box-shadow: 0 0 0 3px #c9a24a, 0 0 14px 4px rgba(201,162,74,0.8); border-radius: 2px; animation: pulse 1s ease-in-out infinite alternate; pointer-events: none; }
  .hll { position: absolute; left: 0; top: -24px; white-space: nowrap; background: #c9a24a; color: #13120e; font: 600 12px 'Segoe UI', sans-serif; padding: 2px 6px; border-radius: 2px; }
  @keyframes pulse { from { box-shadow: 0 0 0 3px #c9a24a, 0 0 6px 2px rgba(201,162,74,0.5); } to { box-shadow: 0 0 0 3px #f0d27a, 0 0 18px 6px rgba(240,210,122,0.9); } }
  #bar { position: absolute; display: flex; gap: 8px; align-items: center; background: rgba(21,20,15,0.95); border: 1px solid var(--rule); padding: 5px 8px; font-size: 12px; white-space: nowrap; }
  #bar select { max-width: 170px; padding: 2px 4px; }
  #bar button { padding: 2px 7px; font-size: 12px; }
  #bar .v { font-family: 'PlexMono', monospace; color: var(--gold); }
  #bar .m { color: var(--muted); }
  #msg { position: absolute; background: rgba(21,20,15,0.95); border: 1px solid var(--rule); padding: 8px 10px; font-size: 12px; color: var(--muted); max-width: 420px; }
</style>
</head>
<body>
<div id="frame"><div class="grip" id="grip"></div></div>
<div id="bar"></div>
<div id="msg" hidden></div>
<script src="stash.js"></script>
</body>
</html>
