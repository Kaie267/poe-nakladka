<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="base.css">
<style>
  #card { background: var(--bg); border: 1px solid var(--rule); border-top: 2px solid var(--gold); margin: 0; }
  header { padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .x { grid-row: 1 / span 2; grid-column: 2; align-self: start; background: none; border: none; color: var(--faint); font-size: 16px; padding: 0 2px; }
  .r-Unique .name { color: var(--unique); } .r-Rare .name { color: var(--rare); } .r-Magic .name { color: var(--magic); }
  .r-Gem .name { color: var(--gem); } .r-Currency .name, .r-Divination .name { color: var(--cur); }

  .price { padding: 12px 12px 10px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 12px; border-bottom: 1px solid var(--rule); }
  .big { font-family: 'PlexMono', monospace; font-size: 30px; font-weight: 500; line-height: 1; letter-spacing: -0.03em; }
  .big small { font-size: 14px; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .verdict { font-weight: 600; font-size: 12px; letter-spacing: 0.08em; padding: 3px 8px; border: 1px solid currentColor; border-radius: 2px; }
  .v-sell { color: var(--sell); } .v-vendor { color: var(--faint); } .v-unknown { color: var(--muted); }
  .meta { grid-column: 1 / span 2; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .up { color: var(--sell); } .down { color: var(--bad); }

  section { padding: 9px 12px; border-bottom: 1px solid var(--rule); }
  section:last-child { border-bottom: none; }
  h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; display: flex; justify-content: space-between; align-items: baseline; }
  h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; }

  .mods div { padding: 1px 0; }
  .danger { color: var(--bad); }
  .danger::before { content: '✕ '; }
  .safe { color: var(--muted); }
  .mapstats { display: flex; gap: 14px; margin-bottom: 6px; }

  .flt { display: grid; grid-template-columns: 18px 1fr 54px; gap: 6px; align-items: center; padding: 2px 0; }
  .flt.off { color: var(--faint); }
  .flt.nomatch { color: var(--faint); font-style: italic; }
  .flt input[type=number] { width: 54px; padding: 2px 4px; text-align: right; }
  .opts { display: flex; gap: 12px; align-items: center; margin-top: 7px; color: var(--muted); font-size: 12px; }
  .opts label { display: flex; gap: 4px; align-items: center; }
  .opts .grow { flex: 1; }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; }
  td.p { text-align: right; width: 1%; white-space: nowrap; padding-right: 10px; }
  td.c { color: var(--muted); text-align: right; width: 1%; white-space: nowrap; }
  td.acc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
  .tag { font-size: 10px; color: var(--gold); border: 1px solid var(--gold); padding: 0 3px; border-radius: 2px; margin-left: 4px; }
  .status { color: var(--muted); font-size: 12px; }
  .err { color: var(--bad); font-size: 12px; }
  .foot { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; padding: 6px 12px; }
</style>
</head>
<body>
<div id="card"></div>
<script src="overlay.js"></script>
</body>
</html>
